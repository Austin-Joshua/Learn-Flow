# ==============================================================================
# LEARNFLOW LMS — PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================
# Security Policy:
# - No source-code volume mounts.
# - PostgreSQL is strictly isolated within the internal bridge network (no public port).
# - Mock services (S3Mock, Mailpit) are excluded; production S3 and SMTP are used.
# - All sensitive credentials must be injected via host environment or secret manager.
# - Containers run as unprivileged users.
# ==============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: learnflow-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Mandatory POSTGRES_USER missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Mandatory POSTGRES_PASSWORD missing}
      POSTGRES_DB: ${POSTGRES_DB:-learnflow}
    expose:
      - "5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-learnflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  redis:
    image: redis:7-alpine
    container_name: learnflow-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Mandatory REDIS_PASSWORD missing}"]
    expose:
      - "6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnflow-backend-prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:?Mandatory production DATABASE_URL missing}
      - SECRET_KEY=${SECRET_KEY:?Mandatory production SECRET_KEY missing}
      - JWT_ISSUER=${JWT_ISSUER:-learnflow-auth-authority}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-learnflow-api-clients}
      - HMAC_ACTIVE_KEY_ID=${HMAC_ACTIVE_KEY_ID:?Mandatory HMAC_ACTIVE_KEY_ID missing}
      - HMAC_KEY_RING=${HMAC_KEY_RING:?Mandatory HMAC_KEY_RING missing}
      - COOKIE_SECURE=true
      - CORS_ORIGINS=${CORS_ORIGINS:?Mandatory production CORS_ORIGINS missing}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:?Mandatory production S3_ENDPOINT_URL missing}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?Mandatory production S3_ACCESS_KEY missing}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?Mandatory production S3_SECRET_KEY missing}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:?Mandatory production S3_BUCKET_NAME missing}
      - S3_QUARANTINE_BUCKET=${S3_QUARANTINE_BUCKET:?Mandatory production S3_QUARANTINE_BUCKET missing}
      - S3_REGION=${S3_REGION:-us-east-1}
      - SMTP_HOST=${SMTP_HOST:?Mandatory production SMTP_HOST missing}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM=${SMTP_FROM:?Mandatory production SMTP_FROM missing}
      - SMTP_TLS=${SMTP_TLS:-true}
      - FRONTEND_URL=${FRONTEND_URL:?Mandatory production FRONTEND_URL missing}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnflow-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      # In typical cloud architectures, TLS is terminated upstream (AWS ALB, Cloudflare, Traefik)
      # and forwarded to port 80 with X-Forwarded-Proto: https.
      # Uncomment port 443 if mounting native TLS certificates to /etc/nginx/certs in nginx.conf.
      # - "443:443"
    depends_on:
      - backend
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:

